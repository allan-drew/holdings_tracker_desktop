[project]
name = "holdings-tracker-desktop"
version = "1.0.9"
description = "Desktop application for tracking investment holdings."
authors = [
    {name = "Marco Aurélio Camargo Oliveira", email = "macamargooliveira@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic (>=1.17.2,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pyside6 (>=6.10.1,<7.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "qtawesome (>=1.4.0,<2.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "tzdata (>=2025.3,<2026.0)",
]

[tool.poetry]
packages = [{include = "holdings_tracker_desktop", from = "src"}]
include = ["src/holdings_tracker_desktop/ui/flags/*.svg"]

[tool.poetry.scripts]
app = "holdings_tracker_desktop.main:main"
build-app = "scripts.build:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pyinstaller (>=6.19.0,<7.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
